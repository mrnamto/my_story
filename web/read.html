<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Đọc truyện</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="prog" id="pg"></div>
<div class="bar"><a class="ib" id="back" style="display:grid;place-items:center" aria-label="Về trang truyện">←</a>
<select class="ib" id="sel" style="flex:1;min-width:0" aria-label="Chọn chương"></select>
<button class="ib" id="gear" aria-label="Cài đặt đọc">Aa</button></div>
<article id="art"></article><div class="nav" id="nav"></div>
<div class="panel" id="panel"><div>
<div class="row"><b>Nền</b><div class="seg" data-k="theme"><button data-v="auto">Theo truyện</button><button data-v="light">Sáng</button><button data-v="sepia">Sepia</button><button data-v="dark">Tối</button></div></div>
<div class="row"><b>Font</b><div class="seg" data-k="font"><button data-v="auto">Theo truyện</button><button data-v="serif">Serif</button><button data-v="sans">Sans</button></div></div>
<div class="row"><b>Cỡ chữ</b><button class="ib" id="fm">A−</button><span id="fv"></span><button class="ib" id="fp">A+</button></div>
</div></div>
<script src="common.js"></script><script>
const P = { light: { bg: '#f2f7ff', color: '#0f1f3d', accent: '#2563eb', card: '#ffffff', muted: '#5b6b8a' },
  sepia: { bg: '#efe4cc', color: '#3b2f22', accent: '#9a5b2e', card: '#f6edd9', muted: '#7d6b57' },
  dark: { bg: '#0a1226', color: '#e1e9ff', accent: '#7da4ff', card: '#111b36', muted: '#8fa0c4' } };
const F = { serif: "'Literata',Georgia,serif", sans: "'Be Vietnam Pro',system-ui,sans-serif", mono: "ui-monospace,Menlo,monospace" };
const qs = new URLSearchParams(SEARCH), slug = qs.get('s');
let S, chap, cfm = {}, user = store.get('user', {});
fetch('index.json').then(r => r.json()).then(async d => {
  S = d.stories.find(x => x.slug === slug); if (!S) return $('#art').textContent = 'Không tìm thấy truyện.';
  const i = Math.max(0, S.chapters.findIndex(c => c.file === qs.get('c'))); chap = S.chapters[i];
  $('#back').href = 'story.html?s=' + slug;
  $('#sel').innerHTML = S.chapters.map((c, j) => `<option value="${esc(c.file)}"${j == i ? ' selected' : ''}>${j + 1}. ${esc(c.title)}</option>`).join('');
  $('#sel').onchange = e => go(`read.html?s=${slug}&c=${encodeURIComponent(e.target.value)}`);
  const raw = await (await fetch(`stories/${slug}/${encodeURIComponent(chap.file)}`)).text(), p = parseFM(raw); cfm = p.d;
  const body = p.body.replace(/^\s*#\s+.*\n?/, '');
  document.title = chap.title + ' · ' + S.title;
  $('#art').innerHTML = `<span class="eb">Chương ${i + 1}</span><h1>${esc(chap.title)}</h1>` + md(body, `stories/${slug}/`);
  const prev = S.chapters[i - 1], next = S.chapters[i + 1], u = c => `read.html?s=${slug}&c=${encodeURIComponent(c.file)}`;
  $('#nav').innerHTML = (prev ? `<a href="${u(prev)}">← Chương trước</a>` : '<span class="off">← Chương trước</span>') +
    (next ? `<a class="nx" href="${u(next)}">Chương sau →</a>` : '<span class="off">Hết rồi</span>');
  const l = store.get('last', {}); l[slug] = chap.file; store.set('last', l); store.set('lastStory', slug);
  apply(); const y = store.get('y:' + slug + chap.file, 0); if (y) scrollTo(0, y);
});
function apply() {
  const m = S, auto = !user.theme || user.theme === 'auto';
  const name = auto ? (cfm.theme || m.theme || 'light') : user.theme, p = { ...(P[name] || P.light) };
  if (auto) ['bg', 'color', 'accent'].forEach(k => { const v = cfm[k] || m[k]; if (v) { p[k] = v; if (k == 'bg') { delete p.card; delete p.muted; } } });
  const r = document.documentElement.style;
  r.setProperty('--bg', p.bg); r.setProperty('--pg', p.bg); r.setProperty('--line', 'color-mix(in srgb,'+p.color+' 20%,'+p.bg+')'); r.setProperty('--soft', 'color-mix(in srgb,'+p.accent+' 10%,'+p.bg+')'); r.setProperty('--fg', p.color); r.setProperty('--accent', p.accent);
  r.setProperty('--card', p.card || `color-mix(in srgb,${p.bg},#fff 10%)`); r.setProperty('--muted', p.muted || `color-mix(in srgb,${p.color},${p.bg} 45%)`);
  const fk = (user.font && user.font !== 'auto') ? user.font : (cfm.font || m.font || 'serif');
  r.setProperty('--rf', F[fk] || fk); r.setProperty('--fs', (user.size || +cfm.size || +m.size || 19) + 'px');
  const dc = cfm.dialog || m.dialog, lum = h => { const x = /^#?([0-9a-f]{6})$/i.exec((h || '').trim()); if (!x) return name === 'dark' ? 0 : 1; const n = parseInt(x[1], 16); return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255; };
  if (dc) r.setProperty('--dlg', lum(p.bg) < .45 ? 'color-mix(in srgb,' + dc + ' 55%,#fff)' : dc); else r.removeProperty('--dlg');
  const tc = cfm.thought || m.thought; if (tc) r.setProperty('--tht', lum(p.bg) < .45 ? 'color-mix(in srgb,' + tc + ' 55%,#fff)' : tc); else r.removeProperty('--tht');
  // màu từng nhân vật: char.<ten>: "#mã màu" (info.md hoặc đầu file chương)
  let css = ''; const all = { ...m, ...cfm };
  Object.keys(all).filter(k => k.startsWith('char.')).forEach(k => { const n = k.slice(5).toLowerCase().replace(/[^a-z0-9_-]/g, ''), v = all[k];
    if (n && /^#[0-9a-f]{3,8}$/i.test(v)) { const col = lum(p.bg) < .45 ? `color-mix(in srgb,${v} 55%,#fff)` : v; css += `.c-${n} .dlg,.c-${n} .tht,p.c-${n}.dlg{color:${col}}`; } });
  let st = document.getElementById('chars'); if (!st) { st = document.createElement('style'); st.id = 'chars'; document.head.appendChild(st); } st.textContent = css;
  r.setProperty('--al', cfm.align || m.align || 'left'); r.setProperty('--w', (cfm.width || m.width || 680) + 'px');
  $('#art').classList.toggle('dc', (cfm.dropcap || m.dropcap) === 'true');
  $('#fv').textContent = parseInt(getComputedStyle($('#art')).fontSize);
  document.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', (user[s.dataset.k] || 'auto') === b.dataset.v)));
}
$('#art').addEventListener('click', e => { const im = e.target.closest('.im img'); if (!im) return;
  const o = document.createElement('div'); o.className = 'lb'; o.innerHTML = '<img>'; o.firstChild.src = im.src; o.firstChild.alt = im.alt; o.onclick = () => o.remove(); document.body.appendChild(o); });
$('#gear').onclick = () => $('#panel').classList.toggle('on');
document.addEventListener('click', e => { if (!e.target.closest('#panel,#gear')) $('#panel').classList.remove('on'); });
document.querySelectorAll('.seg').forEach(s => s.onclick = e => { const b = e.target.closest('button'); if (!b) return; user[s.dataset.k] = b.dataset.v; store.set('user', user); apply(); });
const step = n => { user.size = Math.min(34, Math.max(13, (user.size || parseInt(getComputedStyle($('#art')).fontSize)) + n)); store.set('user', user); apply(); };
$('#fm').onclick = () => step(-1); $('#fp').onclick = () => step(1);
let tm; addEventListener('scroll', () => { const h = document.documentElement; $('#pg').style.width = scrollY / (h.scrollHeight - innerHeight || 1) * 100 + '%';
  clearTimeout(tm); tm = setTimeout(() => chap && store.set('y:' + slug + chap.file, scrollY), 300); }, { passive: true });
</script></body></html>
